[project]
name = "bgai"
version = "0.1.0"
description = "Board game AI series — game 1: Terra Mystica (engine AI vs LLM AI vs humans)"
readme = "README.md"
authors = [
    { name = "Keerthik Muruganandam", email = "keerthik.4.m@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "orjson>=3.10",
    "polars>=1.0",
    "pyarrow>=17.0",
    "tenacity>=9.0",
    "trueskill>=0.4.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full 3563-game corpus checks (~70s) -- run explicitly with -m slow",
]
